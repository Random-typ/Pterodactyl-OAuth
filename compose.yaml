services:
  pterodactyl_oauth:
    build: .
    container_name: pterodactyl_oauth
    ports:
      - 8000:8000
    environment:
      - OIDC_CLIENT_ID=
      - OIDC_CLIENT_SECRET=
      - OIDC_DISCOVERY_URL=
      - OIDC_END_SESSION_ENDPOINT=
      - PANEL_URL=
      - PTERODACTYL_API=
      - ADMIN_ROLE_NAME=